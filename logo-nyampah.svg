<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120" role="img" aria-label="Logo NYAMPAH">
  <title>NYAMPAH — ikon aplikasi</title>
  <desc>Hexagon berisi pita daur ulang — peta hidup untuk gang yang truk tidak bisa masuk.</desc>
  <defs>
    <linearGradient id="nyampahGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A05C"/>
      <stop offset="1" stop-color="#0A6B3D"/>
    </linearGradient>
    <!-- one arm of the recycle ribbon (band + arrowhead + dark fold); reused 3x rotated 120deg -->
    <g id="nyampahArm">
      <path d="M 0.0 44.0 A 44 44 0 0 0 43.3 -7.9 L 22.0 -4.0 A 22 22 0 0 1 0.0 22.0 Z" fill="#8CD04A"/>
      <path d="M 43.3 -7.9 L 48.5 -26.0 L 27.5 -18.5 Z" fill="#8CD04A"/>
      <path d="M 0.0 22.0 L 0.0 44.0 L -6.0 40.0 L -5.5 19.5 Z" fill="#3F7A1E"/>
    </g>
  </defs>
  <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#nyampahGrad)"/>
  <!-- hexagon (sel peta / titik kolaboratif) -->
  <path d="M60 12 L101 36 L101 84 L60 108 L19 84 L19 36 Z" fill="#FFFFFF"/>
  <!-- Möbius recycle ribbon -->
  <g transform="translate(60,60) scale(0.54)">
    <use href="#nyampahArm" transform="rotate(0)"/>
    <use href="#nyampahArm" transform="rotate(120)"/>
    <use href="#nyampahArm" transform="rotate(240)"/>
  </g>
</svg>
