<div id="app">

<!-- STATUS BAR -->
  <div class="statusbar" id="statusbar">
    <span id="clock">09:41</span>
    <span class="si" aria-hidden="true"><svg class="ic ic-sm"><use href="#i-grid"/></svg><svg class="ic ic-sm" style="stroke-width:2.4"><use href="#i-check"/></svg></span>
  </div>

  <div class="views" id="views">

<!-- ===== RT: KELOLA LOKASI (setup wilayah & QR) ===== -->
    <section class="view" id="v-lokasi" hidden>
      <div class="pad-top"></div>
      <header class="appbar">
        <div class="bar">
          <button class="iconbtn" onclick="show('v-dashboard',true)" aria-label="Kembali"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
          <div><div class="title"><svg class="ic ic-sm" style="margin-right:7px" aria-hidden="true"><use href="#i-pin"/></svg>Kelola Lokasi</div><div class="sub">Wilayah <b id="lokasiWilayah">RW 05</b></div></div>
        </div>
      </header>
      <div class="content">
        <!-- Kartu wilayah (geofence) -->
        <div class="wilayah-card">
          <div class="wc-ico" aria-hidden="true"><svg class="ic ic-lg"><use href="#i-map"/></svg></div>
          <div style="flex:1;min-width:0">
            <h4 id="wilayahNama">RW 05</h4>
            <p id="wilayahInfo">Radius wilayah 600 m dari titik pusat RW</p>
          </div>
        </div>
        <p class="wilayah-note"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-info"/></svg> Laporan warga di luar wilayah ini otomatis ditolak - agar data tetap relevan dengan RW yang dikelola.</p>

        <div class="section-title">Lokasi Resmi <span id="countResmi" class="badge hijau" style="margin-left:6px">4</span></div>
        <div id="lokasiResmiList"></div>

        <div class="section-title">Titik Ad-hoc (dari warga) <span id="countAdhoc" class="badge kompos" style="margin-left:6px">0</span></div>
        <div id="lokasiAdhocList"></div>

        <button class="btn btn-primer btn-lg" style="margin-top:18px" onclick="sheetTambahLokasi()">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg> Tambah Lokasi Resmi
        </button>
      </div>
    </section>

  </div>


  <div class="scrim" id="scrim" onclick="tutupSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel" tabindex="-1"><div class="handle"></div><div id="sheetContent"></div></div>
  <div class="toast" id="toast"></div>

</div>

<script src="../js/app.js"></script>
<script>
/* Tampilkan layar ini (dan siapkan datanya). Defensif: aman walau elemen lain tidak ada. */
try {
  state.role = 'rt';
  updateHero();
  show('v-lokasi');
  if('v-lokasi'==='v-rute') renderUdin();
  if('v-lokasi'==='v-peta'){ renderPins(); renderRiwayat(); renderProfil(); }
  if('v-lokasi'==='v-riwayat') renderRiwayat();
  if('v-lokasi'==='v-profil') renderProfil();
  if('v-lokasi'==='v-dashboard') renderDashboard();
  if('v-lokasi'==='v-lokasi') renderKelolaLokasi();
  if('v-lokasi'==='v-kontribusi') renderKontribusi();
  if('v-lokasi'==='v-detail') bukaDetail('Gang Pisang');
  if('v-lokasi'==='v-lapor'){ deteksiLokasi(); }
  if('v-lokasi'==='v-konfirmasi'){ state.lokasiPilih='Gang Pisang'; var _cg=document.getElementById('confGang'); if(_cg) _cg.textContent='Gang Pisang'; }
  if('v-lokasi'==='v-bukti'){ state.buktiTarget='G3'; var _bg=document.getElementById('buktiGang'); if(_bg) _bg.textContent='Pisang'; }
} catch(e){ console.warn('init screen:', e.message); }
</script>
</body>
</html>
