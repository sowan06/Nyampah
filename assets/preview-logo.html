<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Logo NYAMPAH</title>
<style>body{font-family:system-ui;background:#e8efe9;padding:32px;}
.row{display:flex;gap:24px;flex-wrap:wrap;}
.box{background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.box img{width:140px;height:140px;object-fit:contain;}
.box .nm{font-size:12px;color:#5F6F66;font-family:monospace;}
</style></head><body>
<div class="row">
  <div class="box"><img src="logos/logo-nyampah.svg"><div class="nm">logo-nyampah.svg</div></div>
  <div class="box"><img src="logos/logo-nyampah-outline.svg"><div class="nm">logo-nyampah-outline.svg</div></div>
  <div class="box"><img src="logos/logo-nyampah.png"><div class="nm">logo-nyampah.png</div></div>
  <div class="box"><img src="logos/favicon-nyampah.png"><div class="nm">favicon-nyampah.png</div></div>
  <div class="box"><img src="logos/logo1.avif"><div class="nm">logo1.avif</div></div>
</div></body></html>
